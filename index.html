<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121212">
  <link rel="stylesheet" href="square-game/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Complete the Square</title>
</head>
<body>
  <nav id="links">
    <a href="docs/" title="How the AI works" aria-label="How the AI works">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z"/></svg>
    </a>
    <a href="https://github.com/Guppy16/CompleteTheSquare" title="Source on GitHub" aria-label="Source on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    </a>
  </nav>
  <h1>Complete the Square</h1>
  <div id="error" role="alert" hidden></div>
  <div id="mode-select" role="tablist" aria-label="Mode">
    <button class="tab active" role="tab" data-mode="board">Over the Board</button>
    <button class="tab" role="tab" data-mode="ai">Against AI</button>
    <button class="tab" role="tab" data-mode="analysis">Analysis</button>
  </div>
  <div id="side-select" hidden>
    <label class="modern-switch side-switch">
      <input type="checkbox" id="ai-first">
      <span class="switch-slider">
        <span class="switch-option left active" data-text="You start"></span>
        <span class="switch-option right" data-text="AI starts"></span>
        <span class="switch-button"></span>
      </span>
    </label>
  </div>
  <div id="analysis" hidden></div>
  <div id="board-area">
    <div id="board"></div>
    <div id="eval-column" hidden>
      <span id="eval-text"></span>
      <div id="eval-bar" title="Evaluation for Green"></div>
    </div>
  </div>
  <p id="status"><span style="background-color: #4CAF5050; padding: 2px 8px; border-radius: 4px; text-shadow: 0 0 3px #4CAF5080;">Green</span> to move</p>
  <div id="controls">
    <button id="undo" class="icon" aria-label="Undo" title="Undo" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L6.5 7 12 12.5V9a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    </button>
    <button id="redo" class="icon" aria-label="Redo" title="Redo" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L6.5 7 12 12.5V9a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    </button>
    <button id="hint" disabled>Hint</button>
    <button id="copy-moves" class="icon" aria-label="Copy moves" title="Copy moves" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
    </button>
    <button id="paste-moves" class="icon" aria-label="Paste moves" title="Paste moves" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 2h-4.2A3 3 0 0 0 12 0a3 3 0 0 0-2.8 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 18H5V4h2v3h10V4h2v16z"/></svg>
    </button>
    <button id="play-again" hidden>Play Again</button>
  </div>
  <div id="move-list" aria-label="Moves played"></div>
  <div id="past-games" aria-label="Past games" hidden></div>
  <script src="square-game/script.js"></script>
</body>
</html>
