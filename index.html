<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121212">
  <link rel="stylesheet" href="square-game/style.css">
  <title>Complete the Square Game</title>
</head>
<body>
  <h1>Complete the Square Game</h1>
  <div id="mode-select">
    <label class="modern-switch">
      <input type="checkbox" id="ai-toggle">
      <span class="switch-slider">
        <span class="switch-option left active" data-text="Over the Board"></span>
        <span class="switch-option right" data-text="Against AI"></span>
        <span class="switch-button"></span>
      </span>
    </label>
  </div>
  <div id="side-select" hidden>
    <label class="modern-switch side-switch">
      <input type="checkbox" id="ai-first">
      <span class="switch-slider">
        <span class="switch-option left active" data-text="You start"></span>
        <span class="switch-option right" data-text="AI starts"></span>
        <span class="switch-button"></span>
      </span>
    </label>
  </div>
  <div id="board"></div>
  <p id="status"><span style="background-color: #4CAF5050; padding: 2px 8px; border-radius: 4px; text-shadow: 0 0 3px #4CAF5080;">Green</span> to move</p>
  <div id="controls">
    <button id="undo" class="icon" aria-label="Undo" title="Undo" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L6.5 7 12 12.5V9a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    </button>
    <button id="redo" class="icon" aria-label="Redo" title="Redo" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L6.5 7 12 12.5V9a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    </button>
    <button id="hint" disabled>Hint</button>
    <button id="copy-moves" class="icon" aria-label="Copy moves" title="Copy moves" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
    </button>
    <button id="paste-moves" class="icon" aria-label="Paste moves" title="Paste moves" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 2h-4.2A3 3 0 0 0 12 0a3 3 0 0 0-2.8 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 18H5V4h2v3h10V4h2v16z"/></svg>
    </button>
    <button id="play-again" hidden>Play Again</button>
  </div>
  <div id="move-list" aria-label="Moves played"></div>
  <script src="square-game/script.js"></script>
</body>
</html>
