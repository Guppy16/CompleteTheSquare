<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="system-ui, sans-serif" font-size="13">
<rect width="760" height="330" rx="10" fill="#121212"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
  </marker>
</defs>

<!-- main thread -->
<text x="40" y="34" fill="#8a8a8a" font-size="12">MAIN THREAD (the page)</text>
<rect x="30" y="44" width="300" height="250" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/>
<rect x="50" y="64" width="260" height="70" rx="6" fill="#2a2a2a"/>
<text x="180" y="88" fill="#e6e6e6" text-anchor="middle" font-weight="700">script.js</text>
<text x="180" y="108" fill="#cfcfcf" text-anchor="middle">clicks → play(row, col)</text>
<text x="180" y="125" fill="#cfcfcf" text-anchor="middle">redraw from board(0), board(1)</text>
<line x1="180" y1="134" x2="180" y2="170" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<rect x="50" y="172" width="260" height="104" rx="6" fill="#2a2a2a" stroke="#4CAF50"/>
<text x="180" y="196" fill="#e6e6e6" text-anchor="middle" font-weight="700">ai.wasm (copy 1)</text>
<text x="180" y="216" fill="#cfcfcf" text-anchor="middle">Session: plies, redo stack, table</text>
<text x="180" y="234" fill="#cfcfcf" text-anchor="middle">the game the page shows</text>
<text x="180" y="256" fill="#8a8a8a" text-anchor="middle" font-size="12">fallback search if the worker fails</text>

<!-- messages -->
<line x1="335" y1="120" x2="425" y2="120" stroke="#ff9900" stroke-width="2" marker-end="url(#arr)"/>
<text x="380" y="104" fill="#ff9900" text-anchor="middle" font-size="12">moves so far,</text>
<text x="380" y="140" fill="#ff9900" text-anchor="middle" font-size="12">kind, budget</text>
<line x1="425" y1="210" x2="335" y2="210" stroke="#ff9900" stroke-width="2" marker-end="url(#arr)"/>
<text x="380" y="194" fill="#ff9900" text-anchor="middle" font-size="12">square, scores,</text>
<text x="380" y="230" fill="#ff9900" text-anchor="middle" font-size="12">lines, depth</text>
<text x="380" y="262" fill="#8a8a8a" text-anchor="middle" font-size="11">postMessage</text>

<!-- worker -->
<text x="440" y="34" fill="#8a8a8a" font-size="12">WEB WORKER (worker.js)</text>
<rect x="430" y="44" width="300" height="250" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/>
<rect x="450" y="64" width="260" height="70" rx="6" fill="#2a2a2a"/>
<text x="580" y="88" fill="#e6e6e6" text-anchor="middle" font-weight="700">replay the moves</text>
<text x="580" y="108" fill="#cfcfcf" text-anchor="middle">reset(), play(...) for each move</text>
<text x="580" y="125" fill="#cfcfcf" text-anchor="middle">then run the request</text>
<line x1="580" y1="134" x2="580" y2="170" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="450" y="172" width="260" height="104" rx="6" fill="#2a2a2a" stroke="#4CAF50"/>
<text x="580" y="196" fill="#e6e6e6" text-anchor="middle" font-weight="700">ai.wasm (copy 2)</text>
<text x="580" y="216" fill="#cfcfcf" text-anchor="middle">ai_suggest · analyse · evaluate</text>
<text x="580" y="234" fill="#cfcfcf" text-anchor="middle">its table persists between requests</text>
<text x="580" y="256" fill="#8a8a8a" text-anchor="middle" font-size="12">blocks only this thread</text>

<text x="380" y="318" fill="#8a8a8a" text-anchor="middle" font-size="12">answers that arrive after the game moved on (undo, new game, tab switch) are dropped</text>
</svg>
